<body class="page-page">

<header class="header"><div class="width"><a class="header-name" href="/">Agenda Ahead</a></div></header>
<nav class="menu" aria-label="Menu"><div class="width"><ul><li><a href="/upcoming">Coming up</a></li><li><a href="/towns">Places</a></li><li><a href="/search">Search</a></li><li><a href="/watch">Follow</a></li></ul></div></nav>
<main id="main" class="width">

<div class="wrap prose">
<h1 id="contact-title">Contact</h1>
<p>Every message is read; add your email address if you want an answer.</p>
  <form id="contact-form" class="contact" novalidate>
    <label class="field">What is this about?
      <select name="kind">
        <option value="correction">A correction, a problem on a page, or town records</option>
        <option value="removal">Delete my alerts or my details</option>
        <option value="message">Something else</option>
      </select>
    </label>
    <label class="field">Message<textarea name="message" id="contact-message" required maxlength="2000"></textarea></label>
    <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="btn" type="submit">Send message</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</div>

</main>
<footer class="footer"><div class="width"><p>Not a government website. <a href="/about">About</a></p></div></footer>
<script src="/app.js" defer></script>
